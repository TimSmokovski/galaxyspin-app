<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060b" />
  <title>Galaxy Spin</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <!-- ===== SVG sprite: brand, game and UI icons ===== -->
  <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g-planet" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#d6c6ff"/><stop offset=".45" stop-color="#8b5cf6"/><stop offset="1" stop-color="#3b1590"/></radialGradient>
      <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c4dff"/><stop offset=".5" stop-color="#c7b3ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient>
      <linearGradient id="g-blade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#e2dcf5"/><stop offset=".51" stop-color="#a39cc0"/><stop offset="1" stop-color="#8a83a8"/></linearGradient>
      <linearGradient id="g-goldmetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe588"/><stop offset="1" stop-color="#e08a10"/></linearGradient>
      <linearGradient id="g-gift" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7ce6"/><stop offset="1" stop-color="#a61ed0"/></linearGradient>
      <linearGradient id="g-giftlid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa6f2"/><stop offset="1" stop-color="#d43ee9"/></linearGradient>
      <linearGradient id="g-rocket" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#e3dcff"/><stop offset="1" stop-color="#a99fd8"/></linearGradient>
      <linearGradient id="g-rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7d95"/><stop offset="1" stop-color="#e02450"/></linearGradient>
      <linearGradient id="g-flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffb42a"/><stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/></linearGradient>
      <linearGradient id="g-amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd85a"/><stop offset="1" stop-color="#ff8a14"/></linearGradient>
      <radialGradient id="g-bomb" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#7e7898"/><stop offset=".45" stop-color="#2d2640"/><stop offset="1" stop-color="#0c0a13"/></radialGradient>
      <linearGradient id="g-wheel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d3de6"/><stop offset="1" stop-color="#2a1a7a"/></linearGradient>
      <linearGradient id="g-gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cffafe"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
      <linearGradient id="g-trophy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe588"/><stop offset=".6" stop-color="#ffb42a"/><stop offset="1" stop-color="#d87a06"/></linearGradient>
      <g id="sword">
        <path d="M24 3 L27 8 L27 28 L21 28 L21 8 Z" fill="url(#g-blade)"/>
        <rect x="16.5" y="27.5" width="15" height="3.8" rx="1.9" fill="url(#g-goldmetal)"/>
        <rect x="22.2" y="31" width="3.6" height="7.5" rx="1.2" fill="#6b3fb8"/>
        <circle cx="24" cy="40.3" r="2.6" fill="url(#g-goldmetal)"/>
      </g>
    </defs>

    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12C17 13 13 17 12 24C11 17 7 13 0 12C7 11 11 7 12 0Z" fill="currentColor"/></symbol>

    <symbol id="i-planet" viewBox="0 0 64 64">
      <g transform="rotate(-18 32 33)"><ellipse cx="32" cy="34" rx="29" ry="8.5" fill="none" stroke="url(#g-ring)" stroke-width="3" opacity=".55"/></g>
      <circle cx="32" cy="32" r="16.5" fill="url(#g-planet)"/>
      <ellipse cx="25.5" cy="24.5" rx="5.2" ry="2.8" fill="#fff" opacity=".45" transform="rotate(-38 25.5 24.5)"/>
      <g transform="rotate(-18 32 33)"><path d="M3 34 A29 8.5 0 0 0 61 34" fill="none" stroke="url(#g-ring)" stroke-width="3.2" stroke-linecap="round"/></g>
      <use href="#i-spark" x="48" y="6" width="9" height="9" color="#efe8ff"/>
      <use href="#i-spark" x="6" y="48" width="7" height="7" color="#efe8ff"/>
    </symbol>

    <symbol id="i-pvp" viewBox="0 0 48 48">
      <use href="#sword" transform="rotate(45 24 22)"/>
      <use href="#sword" transform="rotate(-45 24 22)"/>
    </symbol>

    <symbol id="i-gift" viewBox="0 0 48 48">
      <path d="M24 15.5 C19 5 9.5 8.5 14.5 15.5 Z" fill="url(#g-goldmetal)"/>
      <path d="M24 15.5 C29 5 38.5 8.5 33.5 15.5 Z" fill="url(#g-goldmetal)"/>
      <rect x="9" y="22" width="30" height="19.5" rx="3.5" fill="url(#g-gift)"/>
      <rect x="7" y="15" width="34" height="8.5" rx="3" fill="url(#g-giftlid)"/>
      <rect x="21.4" y="15" width="5.2" height="26.5" fill="url(#g-goldmetal)"/>
      <rect x="9" y="23.5" width="30" height="2" fill="#6d0f8f" opacity=".35"/>
      <rect x="9.5" y="16" width="14" height="1.6" rx=".8" fill="#fff" opacity=".45"/>
    </symbol>

    <symbol id="i-wheel" viewBox="0 0 48 48">
      <circle cx="24" cy="25" r="18" fill="url(#g-wheel)"/>
      <g fill="#a98bff">
        <path d="M24 25 L39 25 A15 15 0 0 1 34.61 35.61 Z"/>
        <path d="M24 25 L24 40 A15 15 0 0 1 13.39 35.61 Z"/>
        <path d="M24 25 L9 25 A15 15 0 0 1 13.39 14.39 Z"/>
        <path d="M24 25 L24 10 A15 15 0 0 1 34.61 14.39 Z"/>
      </g>
      <circle cx="24" cy="25" r="17" fill="none" stroke="url(#g-goldmetal)" stroke-width="3.2"/>
      <circle cx="24" cy="25" r="4.2" fill="url(#g-goldmetal)"/>
      <path d="M24 2.5 L28 9.5 L20 9.5 Z" fill="url(#g-rose)"/>
      <ellipse cx="17" cy="15" rx="5" ry="2.2" fill="#fff" opacity=".22" transform="rotate(-35 17 15)"/>
    </symbol>

    <symbol id="i-rocket" viewBox="0 0 48 48">
      <g transform="rotate(38 24 24)">
        <path d="M20.3 33 C20.8 38.5 22.8 42 24 45 C25.2 42 27.2 38.5 27.7 33 Z" fill="url(#g-flame)"/>
        <path d="M19 26 L12.5 34.5 L19.5 32.5 Z" fill="url(#g-rose)"/>
        <path d="M29 26 L35.5 34.5 L28.5 32.5 Z" fill="url(#g-rose)"/>
        <path d="M24 4 C31.5 10.5 31.5 25 29.2 33 L18.8 33 C16.5 25 16.5 10.5 24 4 Z" fill="url(#g-rocket)"/>
        <path d="M24 4 C27 6.6 28.7 9.4 29.6 12.2 L18.4 12.2 C19.3 9.4 21 6.6 24 4 Z" fill="url(#g-rose)"/>
        <circle cx="24" cy="19.5" r="4" fill="#3b2a8f"/>
        <circle cx="24" cy="19.5" r="2.7" fill="url(#g-planet)"/>
        <rect x="22.6" y="33" width="2.8" height="3" rx=".8" fill="#6f67a0"/>
      </g>
    </symbol>

    <symbol id="i-slots" viewBox="0 0 48 48">
      <path d="M36 21 C39 19 40 16 41 12" fill="none" stroke="#d9d3ee" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="41" cy="11" r="3" fill="url(#g-rose)"/>
      <rect x="12.5" y="5.5" width="19" height="6.5" rx="3.2" fill="url(#g-rose)"/>
      <rect x="7" y="10" width="30" height="30" rx="6" fill="url(#g-amber)"/>
      <rect x="10.5" y="16" width="23" height="14" rx="3" fill="#1b1030"/>
      <text x="22" y="27.4" text-anchor="middle" font-family="Oswald, sans-serif" font-weight="700" font-size="11" fill="#ff5577" letter-spacing=".5">777</text>
      <rect x="5.5" y="37.5" width="33" height="5" rx="2.5" fill="#d66a0a"/>
      <rect x="9" y="11.5" width="26" height="2" rx="1" fill="#fff" opacity=".4"/>
    </symbol>

    <symbol id="i-bomb" viewBox="0 0 48 48">
      <rect x="27.5" y="11.5" width="8" height="7" rx="1.6" fill="#4d4561" transform="rotate(40 31.5 15)"/>
      <path d="M33.5 12 C35.5 8 38.5 7.5 40 5.5" fill="none" stroke="#d6b27a" stroke-width="1.9" stroke-linecap="round"/>
      <circle cx="22" cy="28" r="14" fill="url(#g-bomb)"/>
      <ellipse cx="16.5" cy="21.5" rx="4.5" ry="2.6" fill="#fff" opacity=".32" transform="rotate(-35 16.5 21.5)"/>
      <circle cx="40.5" cy="5" r="3.4" fill="#ffe27a" opacity=".45"/>
      <use href="#i-spark" x="36" y="0.5" width="9" height="9" color="#fff6c8"/>
    </symbol>

    <symbol id="i-gem" viewBox="0 0 48 48">
      <path d="M7 17 L15 7 H33 L41 17 L24 42 Z" fill="url(#g-gem)"/>
      <path d="M15 7 L19 17 L7 17 Z" fill="#fff" opacity=".35"/>
      <path d="M7 17 H41" stroke="#ecfeff" stroke-opacity=".75" stroke-width="1.2"/>
      <path d="M15 7 L19 17 L24 7 L29 17 L33 7" fill="none" stroke="#ecfeff" stroke-opacity=".6" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M19 17 L24 42 L29 17" fill="none" stroke="#0e7490" stroke-opacity=".5" stroke-width="1.2"/>
    </symbol>

    <symbol id="i-trophy" viewBox="0 0 48 48">
      <path d="M14 8 H34 V19 A10 10 0 0 1 14 19 Z" fill="url(#g-trophy)"/>
      <path d="M14 11 H8.5 V14 A7 7 0 0 0 15.5 21 M34 11 H39.5 V14 A7 7 0 0 1 32.5 21" fill="none" stroke="url(#g-trophy)" stroke-width="3" stroke-linecap="round"/>
      <rect x="21.5" y="28" width="5" height="7" fill="#d87a06"/>
      <rect x="15" y="35" width="18" height="6" rx="2" fill="url(#g-trophy)"/>
      <rect x="16.5" y="10" width="4" height="10" rx="2" fill="#fff" opacity=".4"/>
      <use href="#i-spark" x="30" y="1" width="8" height="8" color="#fff6c8"/>
    </symbol>

    <!-- UI line icons -->
    <symbol id="t-games" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><circle cx="17.25" cy="17.25" r="3.9"/></g></symbol>
    <symbol id="t-gift" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="8" width="17" height="4.5" rx="1.3"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5M12 8v12.5M12 8C10.5 4 6.5 4 7.5 6.8 8 8 12 8 12 8Zm0 0c1.5-4 5.5-4 4.5-1.2C16 8 12 8 12 8Z"/></g></symbol>
    <symbol id="t-tasks" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h1.5M4 12h1.5M4 17h1.5M9 7h11M9 12h11M9 17h7"/></g></symbol>
    <symbol id="t-trophy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4ZM7 6H4.5v1.5A3 3 0 0 0 7.5 10.5M17 6h2.5v1.5a3 3 0 0 1-3 3M12 14v3.5M8 20.5h8M9.5 17.5h5"/></g></symbol>
    <symbol id="t-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></g></symbol>
    <symbol id="i-tg" viewBox="0 0 24 24"><path fill="currentColor" d="M20.6 4.3 3.5 10.9c-1.1.44-1.1 1.07-.2 1.35l4.4 1.37 1.7 5.2c.2.57.1.8.7.8.46 0 .66-.21.92-.46l2.2-2.14 4.58 3.38c.84.46 1.45.22 1.66-.78l3-14.16c.31-1.23-.47-1.79-1.26-1.43ZM8.8 13.4l8.9-5.6c.44-.27.85-.12.52.18l-7.64 6.9-.3 3.16-1.48-4.64Z"/></symbol>
    <symbol id="i-yt" viewBox="0 0 24 24"><path fill="currentColor" d="M9.5 7.8v8.4c0 .5.55.8.97.53l6.6-4.2a.63.63 0 0 0 0-1.06l-6.6-4.2a.63.63 0 0 0-.97.53Z"/></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/></g><circle cx="16.8" cy="7.2" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M10.5 13.5a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M13.5 10.5a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></g></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.8 19.5c.9-3 3.2-4.6 6.2-4.6s5.3 1.6 6.2 4.6"/><path d="M15.5 5.2a3.4 3.4 0 0 1 0 6.6M17.5 14.9c1.9.5 3.2 2 3.8 4.6"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.8"/><path d="M15.5 8.5V6.3A2.3 2.3 0 0 0 13.2 4H6.3A2.3 2.3 0 0 0 4 6.3v6.9a2.3 2.3 0 0 0 2.3 2.3h2.2"/></g></symbol>
  </svg>

  <div id="app">
    <!-- Loader -->
    <div id="loader" class="loader">
      <svg class="loader-logo"><use href="#i-planet"/></svg>
      <div class="loader-text">GALAXY SPIN</div>
      <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>

    <!-- Main App -->
    <div id="main" class="hidden">
      <!-- Top bar -->
      <div class="topbar">
        <div class="logo"><svg><use href="#i-planet"/></svg><b>GALAXY SPIN</b></div>
        <div class="topbar-right">
          <div class="balance" onclick="showDepositModal()">
            <img class="star" src="assets/tg_star.png" alt="">
            <span id="user-balance">0</span>
            <span class="plus">+</span>
          </div>
          <div class="topbar-avatar" id="user-avatar"><span>?</span></div>
        </div>
      </div>

      <!-- Pages -->
      <div id="page-cases" class="page active"></div>
      <div id="page-contests" class="page hidden"></div>
      <div id="page-tasks" class="page hidden"></div>
      <div id="page-leaders" class="page hidden"></div>
      <div id="page-profile" class="page hidden"></div>

      <!-- Bottom nav -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-page="cases">
          <span class="nav-ic"><svg><use href="#t-games"/></svg></span>Игры
        </button>
        <button class="nav-btn" data-page="contests">
          <span class="nav-ic"><svg><use href="#t-gift"/></svg></span>Конкурсы
          <div class="nav-badge" id="contests-badge" style="display:none"></div>
        </button>
        <button class="nav-btn" data-page="tasks">
          <span class="nav-ic"><svg><use href="#t-tasks"/></svg></span>Задания
          <div class="nav-badge" id="tasks-badge" style="display:none"></div>
        </button>
        <button class="nav-btn" data-page="leaders">
          <span class="nav-ic"><svg><use href="#t-trophy"/></svg></span>Лидеры
        </button>
        <button class="nav-btn" data-page="profile">
          <span class="nav-ic"><svg><use href="#t-user"/></svg></span>Профиль
        </button>
      </nav>
    </div>
  </div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js?v=3"></script>
  <script src="js/pages/cases.js?v=3"></script>
  <script src="js/pages/contests.js?v=3"></script>
  <script src="js/pages/tasks.js?v=3"></script>
  <script src="js/pages/leaders.js?v=3"></script>
  <script src="js/pages/profile.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script>
    // Fallback: если JS упал — всё равно показать приложение через 3 сек
    setTimeout(function() {
      var loader = document.getElementById('loader');
      var main = document.getElementById('main');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        if (main) main.classList.remove('hidden');
      }
    }, 3000);
  </script>
</body>
</html>
